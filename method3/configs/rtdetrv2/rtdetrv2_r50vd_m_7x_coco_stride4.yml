# Adjusted to implement stride 4 training for RT-DETRv2

# Preserves the stride 4 configuration and uses a four-level pyramid to include the backbone's stride-4 feature map for small birds.

__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r50vd_m_7x_coco_stride4

# Four-level pyramid: include the backbone's stride-4 feature map for small birds.
PResNet:
  return_idx: [0, 1, 2, 3]

HybridEncoder:
  expansion: 0.5
  in_channels: [256, 512, 1024, 2048]
  feat_strides: [4, 8, 16, 32]
  use_encoder_idx: [3]

RTDETRTransformerv2:
  feat_channels: [256, 256, 256, 256]
  feat_strides: [4, 8, 16, 32]
  num_levels: 4
  num_points: [4, 4, 4, 4]
  eval_idx: 2

eval_spatial_size: [640, 640]

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}

epoches: 84

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 81
  collate_fn:
    stop_epoch: 81